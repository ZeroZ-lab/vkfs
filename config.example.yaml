# VKFS Configuration Example
# Copy to ~/.vkfs/config.yaml and fill in your credentials

vectorstore:
  backend: zilliz          # or "qdrant"

  zilliz:
    endpoint: "${ZILLIZ_ENDPOINT}"
    api_key: "${ZILLIZ_API_KEY}"
    collection: "vkfs_test"

embedding:
  provider: openai          # or "cohere"

  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "text-embedding-3-small"

  # ollama:
  #   base_url: "http://localhost:11434"
  #   model: "nomic-embed-text"
  #   # api_key: ""   # optional, for authenticated remote instances

cache:
  enabled: true
  max_size_mb: 100

# ── Benchmark (vkfs bench) ──────────────────────────────
# The bench command uses the same config for vectorstore + embedding.
# For local benchmarking with SQLite + Ollama:
#
# vectorstore:
#   backend: sqlite
#   sqlite:
#     path: ""  # bench overrides to temp dir
#
# embedding:
#   provider: ollama
#   ollama:
#     base_url: "http://localhost:11434"
#     model: "nomic-embed-text"
#
# See benchmarks/data/example/config.yaml for a working example.
