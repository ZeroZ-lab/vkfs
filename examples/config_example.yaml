# VKFS Configuration Examples

# --- SQLite (local, zero dependencies) ---
vectorstore:
  backend: sqlite
  sqlite:
    path: "~/.vkfs/vkfs.db"

embedding:
  provider: siliconflow
  siliconflow:
    api_key: "${SILICONFLOW_API_KEY}"
    model: "BAAI/bge-m3"

